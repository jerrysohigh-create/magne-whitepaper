<p><a href="mailto:info@magne.ai">info@magne.ai</a></p><h2 id="section-1">訂單與交付</h2><p>查詢交付時，請透過官方私密客服渠道提供訂單編號、購買渠道及聯絡方式，不要在公開群組貼出訂單或身份文件。批次更新見里程碑章節。</p><p><a href="/tc/learning/milestone#mag1-delivery">交付更新</a></p><h2 id="section-2">技術與安全回報</h2><p>請提供網絡、應用版本、錯誤及重現步驟。安全問題請先私下描述影響，再協調公開披露；不要提供私鑰、助記詞或錢包密碼。</p>

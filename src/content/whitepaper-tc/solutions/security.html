<h1 id="section-0">應用安全邊界</h1>
<h2 id="section-1">由授權到執行</h2><p>安全應用須核對使用者意圖、限制權限，並在簽署前展示交易內容。硬件金鑰保護有助保護金鑰資料，但不會讓任意合約呼叫變得安全，也不能省略接收者與授權範圍核對。</p><h2 id="section-2">鏈上紀錄</h2><p>可透過對應瀏覽器查閱紀錄，其最終確定性取決於網絡協議；可升級合約、特權操作與鏈外輸入各有信任假設。審計覆蓋指定程式版本與範圍，不延伸至所有後續部署。</p><h2 id="section-3">營運控制</h2><ul><li>公布合約版本與管理權限。</li><li>監察事件、記錄升級並制定恢復流程。</li><li>採最小權限授權，對高影響交易作獨立核對。</li></ul><p><a href="/tc/solutions/hardware">硬件保護層</a></p>

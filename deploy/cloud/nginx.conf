limit_req_zone $binary_remote_addr zone=ledger_reads:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $whitepaper http://whitepaper:3000;
    set $ledger http://ledger-api:8787;
    client_max_body_size 1m;

    location = /mha { return 302 /mha/; }

    location ~ ^/mha/(.*)$ {
        limit_except GET { deny all; }
        limit_req zone=ledger_reads burst=30 nodelay;
        limit_req_status 429;
        rewrite ^/mha/(.*)$ /$1 break;
        proxy_pass $ledger;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        # Never silently serve an old JSON response as a fresh ledger result.
        proxy_cache off;
    }

    location / {
        proxy_pass $whitepaper;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
